services:
  ai-games:
    build: /opt/apps/ai-mastery-games
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
    volumes:
      - ai_games_data:/app/.data
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /opt/apps/portal:/srv/portal:ro
      - /srv/ai-iq-test:/srv/ai-iq-test
      - /srv/snhs:/srv/snhs
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - ai-games

volumes:
  generated_data:
  feedback_data:
  ai_games_data:
  caddy_data:
  caddy_config:

networks:
  web:
